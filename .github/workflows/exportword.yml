name: Export to Word

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Convert Markdown to Word
        uses: docker://pandoc/core:latest
        with:
          args: needs-report/metrology-needs/safety-security/B.07.2-traceability-labs.md needs-report/metrology-needs/safety-security/B.08.2-radioactive-sorption.md needs-report/metrology-needs/safety-security/B.09.2-atom-counting.md -o document.docx

      - name: Make Word document downloadable
        uses: actions/upload-artifact@v4
        with:
          name: word-document
          path: document.docx
          retention-days: 30
